<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Budget Visualizer</h1>
      <button id="theme-toggle" class="btn-icon">🌙</button>
    </header>

    <section class="balance-section">
      <h2>Total Balance</h2>
      <h1 id="total-balance">Rp0</h1>
      <div id="limit-warning" class="warning hidden"></div>
    </section>

    <div class="main-content">
      <div class="left-panel">
        <section class="form-section">
          <h3>Add Transaction</h3>
          <form id="expense-form">
            <div class="form-group">
              <label for="item-name">Expense Name</label>
              <input type="text" id="item-name" placeholder="Example: Lunch" required>
            </div>
            <div class="form-group">
              <label for="item-amount">Amount (Rp)</label>
              <input type="number" id="item-amount" placeholder="Example: 25000" min="1" step="any" required>
            </div>
            <div class="form-group">
              <label for="item-category">Category</label>
              <select id="item-category" required>
                <option value="" disabled selected>Select Category...</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Fun">Fun</option>
              </select>
            </div>
            <button type="submit" class="btn-submit">Add Transaction</button>
          </form>
        </section>

        <section class="chart-section">
          <h3>Expense Distribution</h3>
          <canvas id="expense-chart"></canvas>
        </section>
      </div>

      <div class="right-panel">
        <section class="transactions-section">
          <div class="transactions-header">
            <h3>Transaction History</h3>
            <select id="sort-select">
              <option value="newest">Newest</option>
              <option value="highest">Highest Amount</option>
              <option value="lowest">Lowest Amount</option>
              <option value="category">Category (A-Z)</option>
            </select>
          </div>
          <div class="transactions-list" id="transactions-list"></div>
        </section>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
